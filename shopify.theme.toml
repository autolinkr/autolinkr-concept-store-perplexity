# Shopify Theme Configuration
# https://shopify.dev/docs/themes/tools/cli/configuration

# DEFAULT / SCRATCH target — a safe, unpublished theme.
# Any experimentation, dry-runs, or non-product-launch theme work goes here so a
# stray push can never hit the live store. The new-product-launch Stage-6 deploy
# does NOT use this env — it targets production (see below) with --allow-live.
#
# This repo is the LIVE-STORE MIRROR ONLY. The ConceptThemeZoV2.0 redesign
# (theme 187077099554) lives in its own separate repo — do NOT target it here.
[environments.development]
# ConceptThemeBackup — unpublished, safe scratch target for live-bound dry-runs
theme = "184028332066"
store = "aa3954.myshopify.com"
ignore = [
  "_reference-autolinkr-concept-store/**"
]

# LIVE deploy target — ConceptThemePerplexity, role: main (the real storefront).
# Owner directive (2026-06-16): new product pages are built directly on the live
# theme, ADDITIVE-ONLY — a new templates/product.<suffix>.json plus any NEW
# product-specific sections. NEVER modify a shared/global section here.
#   - Writing here requires the single-file pusher with the explicit --allow-live flag:
#       python theme_push_one.py templates/product.<suffix>.json --env production --allow-live --yes
#   - The bulk pusher (theme_push.py) ALWAYS refuses role:main — blasting all files
#     to live is never allowed.
#   - The product stays status=draft until Nick/Alec flip it active, so customers
#     never see the new page before approval even though its template lives on prod.
#   - Every live push is committed + pushed to GitHub for one-command revert.
[environments.production]
theme = "184215470114"
store = "aa3954.myshopify.com"
ignore = [
  "_reference-autolinkr-concept-store/**"
]
